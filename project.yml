name: UseUp
options:
  bundleIdPrefix: com.ryleurcia
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: 4.4.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.21.0
  # Vendored + trimmed: upstream ships 9,108 imagesets (71 MB) in one asset
  # catalog, which actool compiles as a single multi-minute build task. See
  # Scripts/prune_phosphor_icons.sh.
  PhosphorSwift:
    path: Vendor/PhosphorSwift
targets:
  UseUp:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Features
      - Fonts
      - Assets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryleurcia.useup
        PRODUCT_NAME: UseUp
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 89XZMUB5H9
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          ENABLE_DEBUG_DYLIB: YES
          CODE_SIGN_ENTITLEMENTS: UseUp.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: UseUpRelease.entitlements
    dependencies:
      - package: Supabase
      - package: SwiftSoup
      - package: Lottie
      - package: PhosphorSwift
      - package: RevenueCat
        products:
          - RevenueCat
          - RevenueCatUI
    scheme:
      testTargets:
        - UseUpTests
  UseUpTests:
    type: bundle.unit-test
    platform: iOS
    host: UseUp
    sources:
      - UseUpTests
    dependencies:
      - target: UseUp
    settings:
      base:
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 89XZMUB5H9
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
