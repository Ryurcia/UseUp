name: UseUp
options:
  bundleIdPrefix: com.ryleurcia
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.21.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: 4.4.0
  PhosphorSwift:
    url: https://github.com/phosphor-icons/swift
    from: 2.1.0
targets:
  UseUp:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Features
      - Fonts
      - Assets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryleurcia.leftoverai
        PRODUCT_NAME: UseUp
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 89XZMUB5H9
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: Supabase
      - package: RevenueCat
        products:
          - RevenueCat
          - RevenueCatUI
      - package: SwiftSoup
      - package: Lottie
      - package: PhosphorSwift
    scheme:
      testTargets: []
