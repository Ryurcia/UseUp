name: UseUp
options:
  bundleIdPrefix: com.ryleurcia
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1
targets:
  UseUp:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Features
      - Fonts
      - Assets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryleurcia.leftoverai
        PRODUCT_NAME: UseUp
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: Supabase
    scheme:
      testTargets: []
